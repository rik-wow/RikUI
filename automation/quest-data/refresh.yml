name: Refresh quest data
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when inputs are unchanged
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['tools/**', 'src/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: quest-data-refresh
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Resolve current sources and skip unchanged inputs
        id: probe
        env:
          FORCE: ${{ inputs.force }}
        run: |
          flags=()
          if [ "$FORCE" = true ]; then flags+=(--force); fi
          python -B tools/quest_data_refresh.py probe --work "$RUNNER_TEMP/quest-data" "${flags[@]}"
      - name: Install build dependencies
        if: steps.probe.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit lua5.1
      - name: Check compiler and updater regressions
        if: steps.probe.outputs.changed == 'true'
        run: python -B -m unittest discover -s tests -p 'test_quest*.py'
      - name: Export, compile, replay and package
        if: steps.probe.outputs.changed == 'true'
        run: python -B tools/quest_data_refresh.py build --work "$RUNNER_TEMP/quest-data" --dist dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.probe.outputs.changed == 'true'
        with:
          name: quest-data-release
          path: dist/
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: build
    if: needs.build.outputs.changed == 'true' && github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quest-data-release
          path: dist
      - name: Publish private release and commit source receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/quest_data_release.py --repo rik-wow/quest-data --dist dist

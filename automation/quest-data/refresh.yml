name: Refresh quest data
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when inputs are unchanged
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['tools/**', 'src/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: quest-data-refresh
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve current sources and skip unchanged inputs
        id: probe
        env:
          FORCE: ${{ inputs.force }}
        run: |
          flags=()
          if [ "$FORCE" = true ]; then flags+=(--force); fi
          python -B tools/quest_data_refresh.py probe --work "$RUNNER_TEMP/quest-data" "${flags[@]}"
      - name: Install build dependencies
        if: steps.probe.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit lua5.1
      - name: Check compiler and updater regressions
        if: steps.probe.outputs.changed == 'true'
        run: python -B -m unittest discover -s tests -p 'test_quest*.py'
      - name: Export, compile, replay and package
        if: steps.probe.outputs.changed == 'true'
        run: python -B tools/quest_data_refresh.py build --work "$RUNNER_TEMP/quest-data" --dist dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.probe.outputs.changed == 'true'
        with:
          name: quest-data-release
          path: dist/
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: build
    if: needs.build.outputs.changed == 'true' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quest-data-release
          path: dist
      - name: Publish private release and commit source receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/quest_data_release.py --repo rik-wow/quest-data --dist dist

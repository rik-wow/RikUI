name: Website and upstream provider checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "media/**", "data/**", "presets/**", "RikUI.toc", "Bindings.xml", "web/**", "tools/site-renders/**", "tools/upstream/**", ".github/workflows/infrastructure.yml"]
  pull_request:
    paths: ["src/**", "media/**", "data/**", "presets/**", "RikUI.toc", "Bindings.xml", "web/**", "tools/site-renders/**", "tools/upstream/**", ".github/workflows/infrastructure.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify reviewed Lua renders and failure checks
        run: |
          python -m pip install Pillow==12.3.0
          python -B -m unittest discover -s tools/site-renders -p 'test_*.py'
          python tools/site-renders/check.py
      - name: Test independent normalization and comparison
        run: python3 -B -m unittest discover -s tools/upstream -p 'test_*.py'
      - name: Install LuaJIT for browser/addon conformance
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Install website dependencies
        working-directory: web
        run: npm ci
      - name: Test Worker request and storage boundaries
        working-directory: web
        run: npm test
      - name: Install browser for interface checks
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Verify responsive interface and keyboard controls
        working-directory: web
        run: npm run test:browser
      - name: Validate Worker bundle
        working-directory: web
        run: npm run check

name: Native installer checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["installer/**", "tools/build_installer*.py", "tests/test_installer_bundle.py", ".github/workflows/installer.yml"]
  pull_request:
    paths: ["installer/**", "tools/build_installer*.py", "tests/test_installer_bundle.py", ".github/workflows/installer.yml"]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify addon UI render evidence
        run: python tools/site-renders/check.py
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy
      - name: Test installer and bundle builder
        run: |
          cargo +1.95.0 test --locked --manifest-path installer/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.95.0 clippy --locked --manifest-path installer/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/test_installer_bundle.py
      - name: Build native window test fixture
        run: |
          python -B tools/build_installer_bundle.py --version 0.0.0-ci --output dist/ci-bundle.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RIKUI_BUNDLE = (Resolve-Path dist/ci-bundle.zip).Path
          cargo +1.95.0 build --release --locked --manifest-path installer/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $process = Start-Process installer/target/release/rikui-installer.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { throw 'Native GUI test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Native GUI test failed' }
